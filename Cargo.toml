[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/golba98/hp-prime-emulator"
rust-version = "1.85"

[workspace.dependencies]
ppl-math = { path = "crates/ppl-math" }
ppl-syntax = { path = "crates/ppl-syntax" }
ppl-compiler = { path = "crates/ppl-compiler" }
ppl-vm = { path = "crates/ppl-vm" }
ppl-graphics = { path = "crates/ppl-graphics" }
ppl-device = { path = "crates/ppl-device" }
ppl-compat = { path = "crates/ppl-compat" }
ppl-gui = { path = "crates/ppl-gui" }
clap = { version = "4.6", features = ["derive"] }
png = "0.18"
fontdue = "0.9"
hidapi = { version = "2.6", default-features = false }
crc = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
winit = "0.30"
softbuffer = "0.4"

[profile.release]
lto = "thin"
codegen-units = 4

# Keep the native ARM backend optimized with symbols in dev/test builds.
# cmake selects RelWithDebInfo instead of an unoptimized Debug Unicorn;
# project Rust debugging, guest timers and checkpoint safety rules stay intact.
[profile.dev.package.unicorn-engine-sys]
opt-level = 2
