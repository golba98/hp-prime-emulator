schema_version=2
id="m18_exported_variables"
[programs.ZZT_M18EXPORT]
source='''EXPORT m18shared:=10,m18list:={1,2},m18matrix:=[[1,2],[3,4]];
LOCAL private:=99;
EXPORT M18READ() BEGIN RETURN {m18shared,m18list,m18matrix,private}; END;
'''
[programs.ZZT_M18CONSUMER]
source='''EXPORT M18GET() BEGIN RETURN {m18shared,m18list,m18matrix}; END;
EXPORT M18SET() BEGIN m18shared:=m18shared+1; m18list(2):=9; m18matrix(2,1):=8; RETURN {m18shared,m18list,m18matrix}; END;
EXPORT M18SCALAR() BEGIN RETURN m18shared; END;
EXPORT M18LCELL() BEGIN RETURN m18list(2); END;
EXPORT M18MCELL() BEGIN RETURN m18matrix(2,1); END;
'''
[[steps]]
action="import"
id="producer"
program="ZZT_M18EXPORT"
[[steps]]
action="import"
id="consumer"
program="ZZT_M18CONSUMER"
[[steps]]
action="run_program"
id="read"
program="ZZT_M18CONSUMER"
entry="M18GET"
[[steps]]
action="run_program"
id="write"
program="ZZT_M18CONSUMER"
entry="M18SET"
[[steps]]
action="run_program"
id="owner_observes_write"
program="ZZT_M18EXPORT"
entry="M18READ"
[[steps]]
action="run_program"
id="repeat_write"
program="ZZT_M18CONSUMER"
entry="M18SET"
[[expect]]
step="read"
path="/return_value/value/0"
value={type="real",value="10"}
[[expect]]
step="write"
path="/return_value/value/0"
value={type="real",value="11"}
[[expect]]
step="write"
path="/return_value/value/1"
value={type="list",value=[{type="real",value="1"},{type="real",value="9"}]}
[[expect]]
step="write"
path="/return_value/value/2"
value={type="matrix",rows=2,columns=2,vector=false,value=[{type="real",value="1"},{type="real",value="2"},{type="real",value="8"},{type="real",value="4"}]}
[[expect]]
step="owner_observes_write"
path="/return_value/value/0"
value={type="real",value="11"}
[[expect]]
step="owner_observes_write"
path="/return_value/value/3"
value={type="real",value="99"}
[[expect]]
step="repeat_write"
path="/return_value/value/0"
value={type="real",value="12"}

[[steps]]
action="run_program"
id="project_scalar"
program="ZZT_M18CONSUMER"
entry="M18SCALAR"
[[steps]]
action="run_program"
id="project_list_cell"
program="ZZT_M18CONSUMER"
entry="M18LCELL"
[[steps]]
action="run_program"
id="project_matrix_cell"
program="ZZT_M18CONSUMER"
entry="M18MCELL"
[[expect]]
step="project_scalar"
path="/return_value"
value={type="real",value="12"}
[[expect]]
step="project_list_cell"
path="/return_value"
value={type="real",value="9"}
[[expect]]
step="project_matrix_cell"
path="/return_value"
value={type="real",value="8"}
