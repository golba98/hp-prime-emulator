schema_version=2
id="m17_typed_values"
[programs.ZZT_M17TYPES]
source='''
EXPORT M17TYPES() BEGIN RETURN {{{1,"nested"}},[[1,2],[3,4]],[1,2,3],(2,3),#FF:8h}; END;
EXPORT M17DECIMALS() BEGIN RETURN {[-12.5,0.25,0],(-12.5,-0.25),#255:8d,#11111111:8b,#377:8o}; END;
EXPORT M17CMATRIX() BEGIN RETURN [[(2,3),(4,-1)]]; END;
'''
[[steps]]
action="import"
id="install"
program="ZZT_M17TYPES"
[[steps]]
action="run_program"
id="nested_types"
program="ZZT_M17TYPES"
entry="M17TYPES"
[[steps]]
action="run_program"
id="decimal_types"
program="ZZT_M17TYPES"
entry="M17DECIMALS"
[[steps]]
action="run_program"
id="complex_matrix"
program="ZZT_M17TYPES"
entry="M17CMATRIX"
[[steps]]
action="run_program"
id="repeat_types"
program="ZZT_M17TYPES"
entry="M17TYPES"
[[expect]]
step="nested_types"
path="/return_value/value/1"
value={type="matrix",rows=2,columns=2,vector=false,value=[{type="real",value="1"},{type="real",value="2"},{type="real",value="3"},{type="real",value="4"}]}
[[expect]]
step="nested_types"
path="/return_value/value/2"
value={type="matrix",rows=1,columns=3,vector=true,value=[{type="real",value="1"},{type="real",value="2"},{type="real",value="3"}]}
[[expect]]
step="nested_types"
path="/return_value/value/3"
value={type="complex",real="2",imaginary="3"}
[[expect]]
step="nested_types"
path="/return_value/value/4"
value={type="integer",literal="#FFh",bits=8,unsigned="255",signed="-1"}
[[expect]]
step="decimal_types"
path="/return_value/value/1"
value={type="complex",real="-12.5",imaginary="-0.25"}
[[expect]]
step="complex_matrix"
path="/return_value"
value={type="matrix",rows=1,columns=2,vector=false,value=[{type="complex",real="2",imaginary="3"},{type="complex",real="4",imaginary="-1"}]}
