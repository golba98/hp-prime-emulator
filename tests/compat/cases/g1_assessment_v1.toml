suite = "g1_assessment_v1"
description = "First physical assessment batch: arithmetic, literal rounding and independent STRING quoting observations. No intended persistent side effects."

[[group]]
id = "bootstrap"
description = "Eight independent, deterministic observations; print channel; fresh program required"

[[case]]
id = "add"
group = "bootstrap"
expr = "1+2"

[[case]]
id = "multiply"
group = "bootstrap"
expr = "6*7"

[[case]]
id = "third"
group = "bootstrap"
expr = "1/3"

[[case]]
id = "round_half"
group = "bootstrap"
expr = "ROUND(2.5,0)"

[[case]]
id = "string_concat"
group = "bootstrap"
expr = '"AB"+"C"'

[[case]]
id = "literal_half"
group = "bootstrap"
expr = "1.234567890125"

[[case]]
id = "string_form_length"
group = "bootstrap"
expr = 'SIZE(STRING("ABC"))'

[[case]]
id = "string_form_first_codepoint"
group = "bootstrap"
body = 'LOCAL a; a:=ASC(LEFT(STRING("ABC"),1)); RETURN a(1);'
