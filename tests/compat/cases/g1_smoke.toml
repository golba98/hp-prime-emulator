# Minimal first hardware run for the HP Prime G1: five side-effect-free
# cases that exercise arithmetic, decimal formatting, ROUND and strings.
# Small enough to read back from one terminal screenshot.

suite = "g1_smoke"
description = "Five side-effect-free smoke probes for a first G1 hardware run"

[[group]]
id = "smoke"
description = "All smoke cases (one program)"

[[case]]
id = "smoke_add"
group = "smoke"
expr = "1+2"
note = "Integer-valued real addition (expected 3)"

[[case]]
id = "smoke_mul"
group = "smoke"
expr = "6*7"
note = "Real multiplication (expected 42)"

[[case]]
id = "smoke_third"
group = "smoke"
expr = "1/3"
note = "12-digit decimal division and STRING formatting (expected 0.333333333333)"

[[case]]
id = "smoke_round"
group = "smoke"
expr = "ROUND(2.5,0)"
note = "Half-way ROUND to 0 places (3 under half-away-from-zero and half-up)"

[[case]]
id = "smoke_strcat"
group = "smoke"
expr = "\"AB\"+\"C\""
note = "String concatenation; also shows how STRING() renders a string result"
