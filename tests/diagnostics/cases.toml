# PPL diagnostic parity corpus.
#
# Each case is a small UTF-8, LF source. `intent` describes what the case
# probes; it is a proposal, not an expected result. Expected results come
# only from reference files under reference/, captured from authoritative
# backends (see docs/compatibility/diagnostic-parity.md).
#
# Changing a source invalidates its reference (the hash no longer matches):
# re-capture before relying on it.

[[case]]
id = "v01_hello"
file = "cases/v01_hello.ppl"
category = "valid"
intent = "Minimal EXPORT function returning a value."

[[case]]
id = "v02_locals_loops"
file = "cases/v02_locals_loops.ppl"
category = "valid"
intent = "LOCAL with initialiser, FOR/FROM/TO/DO, WHILE and REPEAT/UNTIL."

