name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux — native and firmware infrastructure
            exclude: ""
          - os: windows-latest
            name: Windows — native engine
            exclude: "--exclude prime-emulator"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake libudev-dev pkg-config
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace ${{ matrix.exclude }} --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace ${{ matrix.exclude }} --all-targets -- -D warnings
      - name: Tests (firmware assets are not distributed to CI)
        run: cargo test --locked --workspace ${{ matrix.exclude }} --all-targets
      - name: Release build
        run: cargo build --locked --workspace ${{ matrix.exclude }} --release
