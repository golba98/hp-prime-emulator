[package]
name = "ppl-cas"
description = "Supervised external Giac calculator algebra service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Requires the separately built, real Giac executable. Enable it for algebra
# integration runs; missing dependencies fail instead of silently skipping tests.
giac-integration = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
