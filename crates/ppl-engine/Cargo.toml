[package]
name = "ppl-engine"
description = "GUI-independent native and managed firmware PPL backends"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ppl-math.workspace = true
ppl-syntax.workspace = true
ppl-compiler.workspace = true
ppl-vm.workspace = true
ppl-graphics.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = "3"
toml.workspace = true
sha2 = "0.10"
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
