[package]
name = "ppl-cli"
description = "The `ppl` command: run, check, debug and compare HP Prime PPL programs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ppl"
path = "src/main.rs"

[dependencies]
ppl-programs = { path = "../ppl-programs" }
ppl-math.workspace = true
ppl-syntax.workspace = true
ppl-compiler.workspace = true
ppl-vm.workspace = true
ppl-graphics.workspace = true
clap.workspace = true
ppl-device.workspace = true
ppl-compat.workspace = true
ppl-gui.workspace = true
serde_json.workspace = true

serde.workspace = true

ppl-engine = { path = "../ppl-engine" }
ctrlc = "3"
fs2 = "0.4.3"

[dev-dependencies]
egui = "0.32"
png.workspace = true
tempfile = "3"
[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
